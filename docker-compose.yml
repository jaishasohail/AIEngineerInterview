services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      # Windows PostgreSQL already listens on 5432, and Docker's proxy on 5433
      # was not delivering connections to this container. 55432 is the host port.
      # Containers still use postgres:5432 on the Compose network.
      - "55432:5432"
    volumes:
      - helios-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PYTHONUNBUFFERED: "1"
      CHECKPOINT_PATH: /data/checkpoints.sqlite
      ORG_CLOCK: "2026-11-07"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      AUTO_SEED: "true"
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-minishlab/potion-retrieval-32M}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-512}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      HF_HOME: /app/data/models
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      RERANK_ENABLED: ${RERANK_ENABLED:-false}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      OPENROUTER_TIMEOUT_SECONDS: ${OPENROUTER_TIMEOUT_SECONDS:-40}
      OPENROUTER_MAX_RETRIES: ${OPENROUTER_MAX_RETRIES:-3}
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - helios-data:/data
      - embedding-cache:/app/data/models
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/login"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  helios-pg:
  helios-data:
  embedding-cache:
