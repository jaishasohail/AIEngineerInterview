[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Runtime URL comes from DATABASE_URL or application settings in alembic/env.py.
# Host development: localhost:55432. The Compose backend uses hostname postgres and port 5432.
sqlalchemy.url = postgresql+psycopg://localhost:55432/helios

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
